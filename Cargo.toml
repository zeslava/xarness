[package]
name = "xarness"
version = "0.8.4"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
ignore = "0.4"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml = "0.9"
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http = "1"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
unicode-width = "0.2"
